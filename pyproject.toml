[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "crispr-score-analyzer"
dynamic = ["version"]
description = "Cohort-scoped Python library, CLI, and interactive browser platform for DepMap CRISPR gene essentiality and co-dependency analysis."
readme = "README.md"
license = "MIT"
license-files = ["License"]
requires-python = ">=3.10"
authors = [
    { name = "Changhao Kan", email = "kanchanghao@szbl.ac.cn" },
]
keywords = [
    "CRISPR",
    "DepMap",
    "Chronos",
    "gene-essentiality",
    "co-dependency",
    "cancer-genomics",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pandas>=2.0.0,<3",
    "numpy>=1.24.0,<3",
    "plotly>=6.1.1,<7",
    "kaleido==0.2.1",
    "pillow>=10.0.0,<13",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.64.0,<2",
]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/ChanghaoKan/crispr-score-analyzer"
Repository = "https://github.com/ChanghaoKan/crispr-score-analyzer"
Issues = "https://github.com/ChanghaoKan/crispr-score-analyzer/issues"
Documentation = "https://github.com/ChanghaoKan/crispr-score-analyzer/blob/main/docs/api.md"
"Live App" = "https://crispr-score-analyzer-szbl-denglab.streamlit.app/"

[project.scripts]
crispr-score-analyzer = "crispr_score_analyzer.cli:main"

[tool.hatch.version]
path = "crispr_score_analyzer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["crispr_score_analyzer"]

[tool.hatch.build.targets.wheel.force-include]
"data/gene_aliases.json" = "crispr_score_analyzer/data/gene_aliases.json"

[tool.hatch.build.targets.sdist]
include = [
    "/crispr_score_analyzer",
    "/data/gene_aliases.json",
    "/data/DEPMAP_TERMS.md",
    "/docs",
    "/tests",
    "/app.py",
    "/analysis_core.py",
    "/codependency.py",
    "/figure_export.py",
    "/README.md",
    "/CONTRIBUTING.md",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/License",
    "/pyproject.toml",
    "/requirements.txt",
]
exclude = [
    "/data/depmap_chronos.npz",
    "/data/raw",
    "/preprint",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
